name: Publish GSU Release

on:
  push:
    branches: [warder-master-production]
    paths:
      - '.release-request'
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Exact version to publish, for example 13.29-w10"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gsu-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: warder-master-production

      - name: Install gettext compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Validate release identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < src/GlassSysUtil/version)"
          EXPECTED="${{ inputs.expected_version || '' }}"
          if [ -z "$EXPECTED" ] && [ -f .release-request ]; then
            EXPECTED="$(head -n 1 .release-request | tr -d '\r\n')"
          fi
          test -n "$VERSION"
          test "$VERSION" = "$EXPECTED"
          grep -Fqx "Version: $VERSION" packaging/CONTROL/control
          grep -Fq "$VERSION" packaging/CONTROL/postinst
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable release." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate source
        run: |
          set -euo pipefail
          python3 -m py_compile src/GlassSysUtil/plugin.py
          test -s src/GlassSysUtil/plugin.py
          test -s src/GlassSysUtil/__init__.py
          test -s src/GlassSysUtil/SysMgt.png
          file --mime-type src/GlassSysUtil/SysMgt.png | grep -Fq 'image/png'
          grep -q 'def _temperature_candidates' src/GlassSysUtil/plugin.py
          grep -q 'def _temperature_values' src/GlassSysUtil/plugin.py
          grep -q 'Check for updates' src/GlassSysUtil/plugin.py
          ! grep -q 'WHERE_SESSIONSTART' src/GlassSysUtil/plugin.py
          ! grep -q 'def _auto_update_check' src/GlassSysUtil/plugin.py
          ! grep -q '_AUTO_UPDATE_STARTED' src/GlassSysUtil/plugin.py
          grep -q 'ScrollLabel' src/GlassSysUtil/plugin.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 - <<'PY'
          from pathlib import Path
          msgid = 'msgid "Live OSCam: %d active client/reader rows  |  OK = row details"'
          for lang in ("sk", "cs", "de", "pl", "it", "es", "fr"):
              data = Path(f"src/GlassSysUtil/locale/{lang}/LC_MESSAGES/GlassSysUtil.po").read_text(encoding="utf-8")
              assert msgid in data, lang
              block = data[data.index(msgid):].split("\n\n", 1)[0]
              msgstr = next(line for line in block.splitlines() if line.startswith("msgstr "))
              assert msgstr.count("%d") == 1 and "%s" not in msgstr, (lang, block)
          PY

      - name: Build and validate deterministic IPK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          rm -rf dist
          ./tools/build-ipk.sh
          IPK="$GITHUB_WORKSPACE/dist/enigma2-plugin-glasssysutil_${VERSION}_all.ipk"
          test -s "$IPK"
          test -s "$IPK.sha256"
          test "$(ar t "$IPK" | tr '\n' ' ')" = "debian-binary control.tar.gz data.tar.gz "
          test "$(ar p "$IPK" debian-binary)" = "2.0"
          ar p "$IPK" control.tar.gz | tar -xzOf - ./control | grep -Fqx "Package: enigma2-plugin-glasssysutil"
          ar p "$IPK" control.tar.gz | tar -xzOf - ./control | grep -Fqx "Version: $VERSION"
          FILES="$(mktemp)"
          ar p "$IPK" data.tar.gz | tar -tzf - > "$FILES"
          grep -Fq 'usr/lib/enigma2/python/Plugins/Extensions/GlassSysUtil/plugin.py' "$FILES"
          grep -Fq 'usr/lib/enigma2/python/Plugins/Extensions/GlassSysUtil/SysMgt.png' "$FILES"
          for lang in sk cs de pl it es fr; do
            grep -Fq "usr/lib/enigma2/python/Plugins/Extensions/GlassSysUtil/locale/$lang/LC_MESSAGES/GlassSysUtil.mo" "$FILES"
          done
          ! grep -Fq '.po' "$FILES"
          SHA256="$(sha256sum "$IPK" | awk '{print $1}')"
          sha256sum -c "$IPK.sha256"
          echo "ipk=$IPK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          SHA="${{ steps.meta.outputs.sha }}"
          IPK="${{ steps.build.outputs.ipk }}"
          DIGEST="${{ steps.build.outputs.sha256 }}"
          cat > release-notes.md <<EOF
          Glass System Utility - Warder Evolution $VERSION

          Production source commit:
          $SHA

          IPK:
          $(basename "$IPK")

          SHA-256:
          $DIGEST
          EOF
          gh release create "$TAG" "$IPK" "$IPK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Glass System Utility - Warder Evolution $VERSION" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          IPK="${{ steps.build.outputs.ipk }}"
          EXPECTED="${{ steps.build.outputs.sha256 }}"
          NAME="$(basename "$IPK")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish,assets > release.json
          python3 - <<'PY'
          import json, os
          data=json.load(open("release.json"))
          assert data["isDraft"] is False
          assert data["isPrerelease"] is False
          assert data["tagName"] == os.environ["TAG"]
          assert data["targetCommitish"] == os.environ["TARGET"]
          assets={a["name"]:a for a in data["assets"]}
          assert os.environ["NAME"] in assets
          digest=assets[os.environ["NAME"]].get("digest")
          if digest:
              assert digest == "sha256:" + os.environ["EXPECTED"]
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ steps.meta.outputs.sha }}
          NAME: enigma2-plugin-glasssysutil_${{ steps.meta.outputs.version }}_all.ipk
          EXPECTED: ${{ steps.build.outputs.sha256 }}
